# Toolchain for the Infrastructure as Code class.
#
# Install everything with:  mise install
# Activate per shell with:  eval "$(mise activate zsh)"
#
# Versions are pinned so that every terminal in the room behaves the same way.

[tools]
# 1.5.7 is the last Terraform release under the Mozilla Public Licence. Steps 01
# and 02 use it. Step 03 covers what happened next and switches to OpenTofu for
# the rest of the class.
terraform  = "1.5.7"
opentofu   = "1.12"
terragrunt = "1.1.3"

# Runs the commit hooks in .pre-commit-config.yaml.
pre-commit = "4.6"

[env]
# One shared provider download cache for every directory in this repository, so
# each new step does not re-download the same provider. Create the directory
# once during setup, otherwise OpenTofu warns and silently skips the cache.
TF_PLUGIN_CACHE_DIR = "{{env.HOME}}/.terraform.d/plugin-cache"

# Terragrunt calls tofu rather than terraform. Used from step 08.
TG_TF_PATH = "tofu"

# The terraform_fmt commit hook calls tofu rather than terraform.
PCT_TFPATH = "tofu"
